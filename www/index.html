<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار القراءة الصوتية</title>
<style>
  body {
    font-family: -apple-system, "Segoe UI", Tahoma, sans-serif;
    background: #f4f4f8;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    padding: 24px;
    max-width: 480px;
    width: 100%;
  }
  textarea {
    width: 100%;
    min-height: 140px;
    font-size: 16px;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #ddd;
    box-sizing: border-box;
    resize: vertical;
    font-family: inherit;
  }
  .controls {
    display: flex;
    gap: 10px;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  button {
    flex: 1;
    padding: 14px;
    font-size: 16px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
  }
  #startBtn { background: #2563eb; color: #fff; }
  #stopBtn { background: #e5e7eb; color: #333; }
  #status { margin-top: 12px; font-size: 14px; color: #666; text-align: center; }
</style>
</head>
<body>
  <div class="card">
    <h2>اختبار القراءة الصوتية (Native Plugin)</h2>
    <textarea id="textInput">مرحباً، هذا نص تجريبي لاختبار خاصية القراءة الصوتية. اضغط زر ابدأ القراءة لسماع النص.</textarea>
    <div class="controls">
      <button id="startBtn">▶ ابدأ القراءة</button>
      <button id="stopBtn">⏹ إيقاف</button>
    </div>
    <div id="status">جاهز</div>
  </div>

<script type="module">
  import { registerPlugin, Capacitor } from '@capacitor/core';

  const TtsPlugin = registerPlugin('TtsPlugin');

  const textInput = document.getElementById('textInput');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const status = document.getElementById('status');

  async function speak() {
    if (!Capacitor.isNativePlatform()) {
      status.textContent = 'لازم تشغّل الصفحة دي جوه تطبيق الأندرويد نفسه';
      return;
    }
    try {
      status.textContent = '🔊 جاري القراءة...';
      await TtsPlugin.speak({ text: textInput.value });
    } catch (err) {
      status.textContent = 'خطأ: ' + err.message;
    }
  }

  async function stop() {
    try {
      await TtsPlugin.stop();
      status.textContent = 'تم الإيقاف';
    } catch (err) {
      status.textContent = 'خطأ: ' + err.message;
    }
  }

  startBtn.addEventListener('click', speak);
  stopBtn.addEventListener('click', stop);
</script>
</body>
</html>
