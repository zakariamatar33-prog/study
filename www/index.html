<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار القراءة الصوتية</title>
<style>
  body {
    font-family: -apple-system, "Segoe UI", Tahoma, sans-serif;
    background: #f4f4f8;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    padding: 24px;
    max-width: 480px;
    width: 100%;
  }
  button {
    width: 100%;
    padding: 16px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    background: #2563eb;
    color: #fff;
    margin-top: 12px;
  }
  #stopBtn { background: #e5e7eb; color: #333; }
  .toolsRow {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .toolsRow button {
    margin-top: 0;
    font-size: 14px;
    padding: 10px;
    background: #eef2ff;
    color: #2563eb;
  }
  #status {
    margin-top: 14px;
    font-size: 14px;
    color: #333;
    background: #f9fafb;
    border-radius: 8px;
    padding: 10px;
    white-space: pre-wrap;
    line-height: 1.8;
    max-height: 140px;
    overflow-y: auto;
  }
  #sentencesList {
    margin-top: 14px;
    max-height: 300px;
    overflow-y: auto;
    border-radius: 8px;
    background: #f9fafb;
    padding: 6px 10px;
  }
  .sentenceItem {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 2px;
    direction: ltr;
    text-align: left;
  }
  .sentenceItem input {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }
  .sentenceItem label {
    font-size: 16px;
    line-height: 1.7;
  }
  .sep {
    border: none;
    border-top: 1px dashed #d1d5db;
    margin: 0;
  }
  .num {
    color: #2563eb;
    font-weight: bold;
  }
</style>
</head>
<body>
  <div class="card">
    <h2>اختبار القراءة الصوتية</h2>
    <p>اختار الجمل اللي تريد قراءتها (هتتقرأ كل جملة مرتين، وكلها كفقرة واحدة متصلة):</p>
    <div class="toolsRow">
      <button id="selectAllBtn">تحديد الكل</button>
      <button id="clearAllBtn">إلغاء التحديد</button>
    </div>
    <div id="sentencesList"></div>
    <button id="startBtn">▶ ابدأ القراءة</button>
    <button id="stopBtn">⏹ إيقاف</button>
    <div id="status">جاري فحص البيئة...</div>
  </div>

<script>
  var statusEl = document.getElementById('status');
  var listEl = document.getElementById('sentencesList');

  // 50 جملة يابانية للحياة اليومية
  var sentences = [
    "おはようございます。",
    "おやすみなさい。",
    "ただいま。",
    "いってきます。",
    "いってらっしゃい。",
    "ありがとうございます。",
    "すみません。",
    "お願いします。",
    "わかりました。",
    "わかりません。",
    "今何時ですか。",
    "トイレはどこですか。",
    "これはいくらですか。",
    "水をください。",
    "お腹が空きました。",
    "喉が渇きました。",
    "疲れました。",
    "眠いです。",
    "今日は暑いですね。",
    "今日は寒いですね。",
    "雨が降っています。",
    "電車に乗ります。",
    "バスを待っています。",
    "駅まで歩きます。",
    "会社に行きます。",
    "学校に行きます。",
    "家に帰ります。",
    "買い物に行きます。",
    "コンビニに寄ります。",
    "スーパーで野菜を買います。",
    "ご飯を食べます。",
    "水を飲みます。",
    "歯を磨きます。",
    "お風呂に入ります。",
    "窓を開けてください。",
    "ドアを閉めてください。",
    "ここに座ってください。",
    "ちょっと待ってください。",
    "もう一度言ってください。",
    "ゆっくり話してください。",
    "日本語が少しわかります。",
    "英語が話せますか。",
    "名前は何ですか。",
    "お元気ですか。",
    "元気です。",
    "今日は何曜日ですか。",
    "明日は休みです。",
    "週末は忙しいです。",
    "また明日会いましょう。",
    "お疲れ様でした。"
  ];

  function log(msg) {
    statusEl.textContent += '\n' + msg;
    statusEl.scrollTop = statusEl.scrollHeight;
    console.log(msg);
  }

  function renderList() {
    listEl.innerHTML = '';
    sentences.forEach(function (s, i) {
      var row = document.createElement('div');
      row.className = 'sentenceItem';

      var checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.id = 'chk-' + i;
      checkbox.checked = true;

      var label = document.createElement('label');
      label.setAttribute('for', 'chk-' + i);
      label.innerHTML = '<span class="num">' + (i + 1) + '.</span> ' + s;

      row.appendChild(checkbox);
      row.appendChild(label);
      listEl.appendChild(row);

      if (i < sentences.length - 1) {
        var hr = document.createElement('hr');
        hr.className = 'sep';
        listEl.appendChild(hr);
      }
    });
  }

  function getSelectedSentences() {
    var selected = [];
    sentences.forEach(function (s, i) {
      var chk = document.getElementById('chk-' + i);
      if (chk && chk.checked) selected.push(s);
    });
    return selected;
  }

  // بناء فقرة واحدة متصلة: كل جملة مكررة مرتين
  function buildParagraph(selected) {
    var parts = [];
    selected.forEach(function (s) {
      parts.push(s);
      parts.push(s);
    });
    return parts.join('　');
  }

  window.addEventListener('load', function () {
    renderList();
    statusEl.textContent = 'فحص البيئة:';
    log('window.Capacitor موجود؟ ' + (typeof window.Capacitor !== 'undefined'));
    if (window.Capacitor) {
      log('isNativePlatform؟ ' + (window.Capacitor.isNativePlatform ? window.Capacitor.isNativePlatform() : 'غير معروف'));
      log('Plugins موجودة؟ ' + (typeof window.Capacitor.Plugins !== 'undefined'));
      if (window.Capacitor.Plugins) {
        log('TtsPlugin موجود؟ ' + (typeof window.Capacitor.Plugins.TtsPlugin !== 'undefined'));
      }
    } else {
      log('⚠️ الصفحة مش شغالة جوه تطبيق Capacitor أصلاً.');
    }
  });

  document.getElementById('selectAllBtn').addEventListener('click', function () {
    sentences.forEach(function (s, i) {
      var chk = document.getElementById('chk-' + i);
      if (chk) chk.checked = true;
    });
  });

  document.getElementById('clearAllBtn').addEventListener('click', function () {
    sentences.forEach(function (s, i) {
      var chk = document.getElementById('chk-' + i);
      if (chk) chk.checked = false;
    });
  });

  document.getElementById('startBtn').addEventListener('click', function () {
    if (!window.Capacitor || !window.Capacitor.Plugins || !window.Capacitor.Plugins.TtsPlugin) {
      log('❌ TtsPlugin مش متاح. تأكد إن الـ APK اتبنى بآخر نسخة من الـ workflow وإن الملف ده جوه المشروع مش بيتفتح كملف منفصل.');
      return;
    }
    var selected = getSelectedSentences();
    if (selected.length === 0) {
      log('⚠️ محتاج تختار جملة واحدة على الأقل.');
      return;
    }
    var paragraph = buildParagraph(selected);
    log('▶ بعتنا فقرة واحدة فيها ' + selected.length + ' جملة (كل جملة مكررة مرتين)...');
    // lang: "ja-JP" بيتبعت للـ plugin عشان يستخدم صوت ياباني لو الـ plugin بيدعمه.
    // لو الصوت لسه مش طبيعي، لازم يتضاف صوت ياباني (Japanese TTS voice) من إعدادات الموبايل نفسه.
    window.Capacitor.Plugins.TtsPlugin.speak({ text: paragraph, lang: 'ja-JP' })
      .then(function () { log('✅ الأمر اتبعت بنجاح للسيرفس.'); })
      .catch(function (err) { log('❌ خطأ: ' + (err && err.message ? err.message : JSON.stringify(err))); });
  });

  document.getElementById('stopBtn').addEventListener('click', function () {
    if (!window.Capacitor || !window.Capacitor.Plugins || !window.Capacitor.Plugins.TtsPlugin) return;
    window.Capacitor.Plugins.TtsPlugin.stop()
      .then(function () { log('⏹ تم الإيقاف.'); })
      .catch(function (err) { log('❌ خطأ إيقاف: ' + err.message); });
  });
</script>
</body>
</html>
