<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار القراءة الصوتية</title>
<style>
  body {
    font-family: -apple-system, "Segoe UI", Tahoma, sans-serif;
    background: #f4f4f8;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    padding: 24px;
    max-width: 480px;
    width: 100%;
  }
  button {
    width: 100%;
    padding: 16px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    background: #2563eb;
    color: #fff;
    margin-top: 12px;
  }
  #stopBtn { background: #e5e7eb; color: #333; }
  #status {
    margin-top: 14px;
    font-size: 14px;
    color: #333;
    background: #f9fafb;
    border-radius: 8px;
    padding: 10px;
    white-space: pre-wrap;
    line-height: 1.8;
    max-height: 160px;
    overflow-y: auto;
  }
  #sentencesList {
    margin-top: 14px;
    max-height: 260px;
    overflow-y: auto;
    border-radius: 8px;
    background: #f9fafb;
    padding: 10px;
  }
  .sentenceItem {
    padding: 10px 6px;
    font-size: 16px;
    line-height: 1.9;
    direction: ltr;
    text-align: left;
  }
  .sentenceItem.active {
    background: #eff6ff;
    border-radius: 6px;
    font-weight: bold;
  }
  .sep {
    border: none;
    border-top: 1px dashed #d1d5db;
    margin: 0;
  }
  .num {
    color: #2563eb;
    font-weight: bold;
    margin-left: 6px;
  }
</style>
</head>
<body>
  <div class="card">
    <h2>اختبار القراءة الصوتية</h2>
    <p>الجمل اللي هتتقرأ (50 جملة، كل جملة تتكرر مرتين):</p>
    <div id="sentencesList"></div>
    <button id="startBtn">▶ اقرأ كل الجمل</button>
    <button id="stopBtn">⏹ إيقاف</button>
    <div id="status">جاري فحص البيئة...</div>
  </div>

<script>
  var statusEl = document.getElementById('status');
  var listEl = document.getElementById('sentencesList');

  // 50 جملة يابانية للحياة اليومية
  var sentences = [
    "おはようございます。",
    "おやすみなさい。",
    "ただいま。",
    "いってきます。",
    "いってらっしゃい。",
    "ありがとうございます。",
    "すみません。",
    "お願いします。",
    "わかりました。",
    "わかりません。",
    "今何時ですか。",
    "トイレはどこですか。",
    "これはいくらですか。",
    "水をください。",
    "お腹が空きました。",
    "喉が渇きました。",
    "疲れました。",
    "眠いです。",
    "今日は暑いですね。",
    "今日は寒いですね。",
    "雨が降っています。",
    "電車に乗ります。",
    "バスを待っています。",
    "駅まで歩きます。",
    "会社に行きます。",
    "学校に行きます。",
    "家に帰ります。",
    "買い物に行きます。",
    "コンビニに寄ります。",
    "スーパーで野菜を買います。",
    "ご飯を食べます。",
    "水を飲みます。",
    "歯を磨きます。",
    "お風呂に入ります。",
    "窓を開けてください。",
    "ドアを閉めてください。",
    "ここに座ってください。",
    "ちょっと待ってください。",
    "もう一度言ってください。",
    "ゆっくり話してください。",
    "日本語が少しわかります。",
    "英語が話せますか。",
    "名前は何ですか。",
    "お元気ですか。",
    "元気です。",
    "今日は何曜日ですか。",
    "明日は休みです。",
    "週末は忙しいです。",
    "また明日会いましょう。",
    "お疲れ様でした。"
  ];

  var stopped = true;

  function log(msg) {
    statusEl.textContent += '\n' + msg;
    statusEl.scrollTop = statusEl.scrollHeight;
    console.log(msg);
  }

  function renderList() {
    listEl.innerHTML = '';
    sentences.forEach(function (s, i) {
      var div = document.createElement('div');
      div.className = 'sentenceItem';
      div.id = 'sentence-' + i;
      div.textContent = (i + 1) + '. ' + s;
      listEl.appendChild(div);
      if (i < sentences.length - 1) {
        var hr = document.createElement('hr');
        hr.className = 'sep';
        listEl.appendChild(hr);
      }
    });
  }

  function highlight(index) {
    var prev = document.querySelector('.sentenceItem.active');
    if (prev) prev.classList.remove('active');
    var el = document.getElementById('sentence-' + index);
    if (el) {
      el.classList.add('active');
      el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }
  }

  function delay(ms) {
    return new Promise(function (resolve) { setTimeout(resolve, ms); });
  }

  // مهلة تقريبية حسب طول الجملة عشان الجملة اللي بعدها متبدأش قبل ما الصوت يخلص
  function estimateDuration(text) {
    return Math.max(1200, text.length * 180);
  }

  function speakOnce(text) {
    return window.Capacitor.Plugins.TtsPlugin.speak({ text: text })
      .then(function () { return delay(estimateDuration(text)); })
      .catch(function (err) {
        log('❌ خطأ: ' + (err && err.message ? err.message : JSON.stringify(err)));
      });
  }

  async function playAll() {
    if (!window.Capacitor || !window.Capacitor.Plugins || !window.Capacitor.Plugins.TtsPlugin) {
      log('❌ TtsPlugin مش متاح. تأكد إن الـ APK اتبنى بآخر نسخة من الـ workflow وإن الملف ده جوه المشروع مش بيتفتح كملف منفصل.');
      return;
    }
    stopped = false;
    log('▶ بدأنا القراءة...');
    for (var i = 0; i < sentences.length; i++) {
      if (stopped) break;
      highlight(i);
      for (var r = 1; r <= 2; r++) {
        if (stopped) break;
        log('▶ جملة ' + (i + 1) + '/' + sentences.length + ' - تكرار ' + r + '/2');
        await speakOnce(sentences[i]);
        if (stopped) break;
        await delay(300); // فاصل قصير بين التكرارين
      }
      if (stopped) break;
      await delay(600); // فاصل بين كل جملة والتانية
    }
    if (!stopped) {
      log('✅ انتهت كل الـ 50 جملة.');
    } else {
      log('⏹ تم الإيقاف.');
    }
  }

  window.addEventListener('load', function () {
    renderList();
    statusEl.textContent = 'فحص البيئة:';
    log('window.Capacitor موجود؟ ' + (typeof window.Capacitor !== 'undefined'));
    if (window.Capacitor) {
      log('isNativePlatform؟ ' + (window.Capacitor.isNativePlatform ? window.Capacitor.isNativePlatform() : 'غير معروف'));
      log('Plugins موجودة؟ ' + (typeof window.Capacitor.Plugins !== 'undefined'));
      if (window.Capacitor.Plugins) {
        log('TtsPlugin موجود؟ ' + (typeof window.Capacitor.Plugins.TtsPlugin !== 'undefined'));
      }
    } else {
      log('⚠️ الصفحة مش شغالة جوه تطبيق Capacitor أصلاً.');
    }
  });

  document.getElementById('startBtn').addEventListener('click', function () {
    playAll();
  });

  document.getElementById('stopBtn').addEventListener('click', function () {
    stopped = true;
    if (!window.Capacitor || !window.Capacitor.Plugins || !window.Capacitor.Plugins.TtsPlugin) return;
    window.Capacitor.Plugins.TtsPlugin.stop()
      .then(function () { log('⏹ أمر الإيقاف اتبعت.'); })
      .catch(function (err) { log('❌ خطأ إيقاف: ' + err.message); });
  });
</script>
</body>
</html>
