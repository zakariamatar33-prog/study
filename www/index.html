<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>にほんご - تعلّم الياباني</title>
<style>
  :root {
    --navy: #1c2b4a;
    --navy-dark: #14213a;
    --bg: #efe9db;
    --card: #fbf8f0;
    --sub: #6b6759;
    --line: #e2ddcc;
    --gold: #d97706;
    --dot: #d13b3b;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Tahoma, sans-serif;
    background: var(--bg);
    margin: 0;
    color: var(--navy);
    padding: 14px 14px 30px;
  }
  .wrap { max-width: 480px; margin: 0 auto; }

  .topBar { display: flex; justify-content: flex-end; margin-bottom: 8px; }
  .modeBtn {
    border: none; background: #fff; color: var(--navy); font-weight: 700; font-size: 12.5px;
    padding: 7px 14px; border-radius: 999px; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.06);
  }

  /* category pills */
  .pillTabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; }
  .pillTabs::-webkit-scrollbar { display: none; }
  .pillTabs button {
    flex-shrink: 0; border: none; border-radius: 999px; padding: 12px 20px; font-size: 14px; font-weight: 700;
    background: #fff; color: var(--navy); cursor: pointer; font-family: inherit;
  }
  .pillTabs button.active { background: var(--navy); color: #fff; }

  /* category label + progress */
  .catHeaderRow { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 12px; }
  .catHeaderRow .catName { font-weight: 700; font-size: 15px; flex-shrink: 0; }
  .progressWrap { display: flex; align-items: center; gap: 8px; flex: 1; }
  .progressTrack { flex: 1; height: 5px; background: #ddd7c5; border-radius: 3px; position: relative; overflow: visible; }
  .progressFill { height: 100%; background: var(--navy); border-radius: 3px; position: relative; }
  .progressFill::after {
    content: ''; position: absolute; left: -4px; top: 50%; transform: translateY(-50%);
    width: 9px; height: 9px; border-radius: 50%; background: var(--dot);
  }
  .progressCount { font-size: 13px; color: var(--sub); flex-shrink: 0; white-space: nowrap; }

  /* flashcard */
  .flashcard {
    background: var(--card); border-radius: 22px; box-shadow: 0 10px 26px rgba(28,43,74,0.1);
    min-height: 380px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 30px 20px; position: relative; cursor: pointer; user-select: none;
  }
  .iconBtn {
    position: absolute; top: 18px; border: none; cursor: pointer; background: #fff;
    display: flex; align-items: center; justify-content: center;
  }
  .speakerBtn { right: 18px; width: 52px; height: 52px; border-radius: 50%; font-size: 20px; box-shadow: 0 3px 8px rgba(0,0,0,0.08); color: var(--navy); }
  .favBtn { left: 18px; width: 44px; height: 44px; border-radius: 12px; border: 2px solid #e8b8a8; font-size: 20px; color: #d1d5db; }
  .favBtn.faved { color: var(--gold); border-color: var(--gold); }

  .jpBig { font-size: 30px; font-weight: 800; direction: ltr; line-height: 1.35; margin-top: 30px; color: var(--navy); }
  .hiraBig { font-size: 16px; color: #8a8674; margin-top: 14px; direction: ltr; }
  .arBig { font-size: 18px; color: #4b4a3e; margin-top: 20px; direction: rtl; display: none; font-weight: 600; }
  .flashcard.revealed .arBig { display: block; }
  .flashcard.revealed .flashHint { display: none; }
  .flashHint { font-size: 13px; color: #a39d87; margin-top: 22px; }

  /* nav row */
  .navRow { display: flex; align-items: center; gap: 10px; margin-top: 18px; }
  .navCircle {
    width: 52px; height: 52px; border-radius: 50%; border: none; background: #fff; color: var(--navy);
    font-size: 20px; font-weight: 700; cursor: pointer; box-shadow: 0 3px 8px rgba(0,0,0,0.06); flex-shrink: 0;
  }
  .flipBtn {
    flex: 1; border: none; background: var(--navy); color: #fff; font-weight: 700; font-size: 16px;
    padding: 16px; border-radius: 999px; cursor: pointer; font-family: inherit;
  }

  .autoPlayBtn {
    width: 100%; margin-top: 14px; border: none; background: #fff; color: var(--navy); font-weight: 700;
    font-size: 15px; padding: 15px; border-radius: 999px; cursor: pointer; font-family: inherit;
    box-shadow: 0 3px 8px rgba(0,0,0,0.05);
  }
  .autoPlayBtn.playing { background: var(--dot); color: #fff; }

  .bottomHint { text-align: center; font-size: 12.5px; color: #a39d87; margin-top: 14px; }

  /* ---- list mode (secondary) ---- */
  #listSection { display: none; }
  .panel { background: var(--card); border-radius: 18px; box-shadow: 0 8px 20px rgba(28,43,74,0.06); padding: 16px; margin-bottom: 14px; }
  .panelTitle { font-size: 13px; font-weight: 700; color: var(--sub); margin-bottom: 10px; }
  .bulkCatList { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .bulkCatList label { display: flex; align-items: center; gap: 5px; background: #efe9db; border-radius: 20px; padding: 6px 12px; font-size: 12.5px; }
  .rowBtns { display: flex; gap: 8px; }
  .btn { border: none; border-radius: 12px; padding: 11px; font-weight: 700; font-size: 13.5px; cursor: pointer; flex: 1; font-family: inherit; }
  .btn.primary { background: var(--navy); color: #fff; }
  .btn.ghost { background: #efe9db; color: var(--navy); }
  .btn.muted { background: #e5e0d0; color: #444; }
  #sentencesList { max-height: 360px; overflow-y: auto; }
  .sentenceItem { display: flex; align-items: flex-start; gap: 8px; padding: 12px 4px; direction: ltr; text-align: left; border-bottom: 1px solid var(--line); }
  .sentenceItem:last-child { border-bottom: none; }
  .sentenceItem input[type=checkbox] { width: 18px; height: 18px; flex-shrink: 0; margin-top: 4px; accent-color: var(--navy); }
  .sentenceItem .txt { line-height: 1.55; flex: 1; }
  .sentenceItem .jp { font-size: 16px; font-weight: 600; }
  .sentenceItem .hira { font-size: 12.5px; color: #8a8674; }
  .sentenceItem .ar { font-size: 13px; color: var(--sub); direction: rtl; text-align: right; margin-top: 3px; }
  .num { color: var(--navy); font-weight: 800; }
  .starBtn { border: none; background: none; font-size: 20px; cursor: pointer; flex-shrink: 0; margin-top: 2px; color: #d8dce1; }
  .starBtn.faved { color: var(--gold); }
  .toolsRow { display: flex; gap: 8px; margin-bottom: 10px; }
  .emptyMsg { padding: 30px 10px; text-align: center; color: #9ca3af; font-size: 14px; }

  #status {
    font-size: 12px; color: #444; background: #fff; border-radius: 12px; padding: 10px; margin-top: 12px;
    white-space: pre-wrap; line-height: 1.7; max-height: 100px; overflow-y: auto;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="topBar"><button class="modeBtn" id="modeToggle">📋 عرض القائمة</button></div>

  <!-- Flashcard section (default) -->

    <div class="flashcard" id="flashcard">

      <button class="iconBtn speakerBtn" id="cardSpeakBtn">🔊</button>

      <div class="hiraBig" id="flashHira"></div>
      <div class="arBig" id="flashAr"></div>
      <div class="flashHint" id="flashHint">☞ اضغط على البطاقة لرؤية المعنى</div>
    </div>

    <div class="navRow">
      <button class="navCircle" id="nextBtn">›</button>
      <button class="flipBtn" id="flipBtn">اقلب البطاقة</button>
      <button class="navCircle" id="prevBtn">‹</button>
    </div>

    <button class="autoPlayBtn" id="autoPlayBtn">▶ تشغيل تلقائي مع النطق</button>
    <div class="bottomHint">اضغط على الفئات في الأعلى للتنقّل بين المواضيع</div>
  </div>

  <!-- List / bulk section (secondary) -->
  <div id="listSection">
    <div class="panel">
      <div class="panelTitle">📢 قراءة جماعية لعدة أقسام</div>
      <div class="bulkCatList" id="bulkCatList"></div>
      <div class="rowBtns">
        <button id="readSelectedCatsBtn" class="btn primary">اقرأ الأقسام المحددة</button>
        <button id="readAllBtn" class="btn muted">اقرأ الكل</button>
      </div>
    </div>
    <div class="panel">
      <div class="toolsRow">
        <button id="selectAllBtn" class="btn ghost">تحديد الكل</button>
        <button id="clearAllBtn" class="btn ghost">إلغاء التحديد</button>
      </div>
      <div id="sentencesList"></div>
      <div class="rowBtns" style="margin-top:12px;">
        <button id="startBtn" class="btn primary">▶ ابدأ القراءة</button>
        <button id="stopBtn" class="btn muted">⏹ إيقاف</button>
      </div>
    </div>
  </div>

  <div id="status">جاري فحص البيئة...</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
  const firebaseConfig = {
    apiKey: "AIzaSyA-OUfKoXFa-VceEdSatx_c38uwlhh4Qf8",
    authDomain: "learn-99f04.firebaseapp.com",
    projectId: "learn-99f04",
    storageBucket: "learn-99f04.firebasestorage.app",
    messagingSenderId: "1042095955824",
    appId: "1:1042095955824:web:689166a89249d1822579b5"
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  window.__fetchCloudLessons = async function () {
    try {
      const snap = await getDocs(collection(db, "lessons"));
      const out = [];
      snap.forEach((docSnap) => {
        const d = docSnap.data();
        out.push({ id: docSnap.id, label: d.label || docSnap.id, order: d.order || 0, items: Array.isArray(d.items) ? d.items : [] });
      });
      out.sort((a, b) => a.order - b.order);
      return out;
    } catch (e) { console.log("cloud lessons fetch failed", e); return []; }
  };
</script>

  function isFav(id) { return favorites.indexOf(id) !== -1; }
  function toggleFav(id) {
    var idx = favorites.indexOf(id);
    if (idx === -1) favorites.push(id); else favorites.splice(idx, 1);
    saveFavorites();
  }

  var allItemsById = {};
  function rebuildIndex() {
    allItemsById = {};
    CONTENT_KEYS.forEach(function (key) {
      categories[key].items.forEach(function (item, i) {
        var id = key + '-' + i;
        allItemsById[id] = { id: id, jp: item[0], hira: item[1], ar: item[2] };

    });
  }

        stopAutoPlay();
        currentCat = key;
        Array.prototype.forEach.call(catRow.children, function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        catNameLabel.textContent = categories[key].label.replace(/^[^\u0600-\u06FF]+/, '').trim() || categories[key].label;
        order = getCurrentItems().map(function (_, i) { return i; });
        cardIndex = 0;
        renderCard();
        renderList();
      });
      catRow.appendChild(btn);
    });
    catNameLabel.textContent = categories[currentCat].label.replace(/^[^\u0600-\u06FF]+/, '').trim() || categories[currentCat].label;
  }

  function buildBulkPanel() {
    bulkCatList.innerHTML = '';
    CONTENT_KEYS.forEach(function (key) {
      var id = 'bulkchk-' + key;
      var label = document.createElement('label');
      label.innerHTML = '<input type="checkbox" id="' + id + '"> ' + categories[key].label;
      bulkCatList.appendChild(label);
    });
  }

  function paragraphForItems(items) {
    var parts = [];
    items.forEach(function (it) { parts.push(it.jp); parts.push(it.jp); });
    return parts.join(' ');
  }

  document.getElementById('readSelectedCatsBtn').addEventListener('click', function () {
    var chosenItems = [], chosenLabels = [];
    CONTENT_KEYS.forEach(function (key) {
      var chk = document.getElementById('bulkchk-' + key);
      if (chk && chk.checked) { chosenLabels.push(categories[key].label); categories[key].items.forEach(function (item) { chosenItems.push({ jp: item[0] }); }); }
    });
    if (chosenItems.length === 0) { log('⚠️ اختر قسمًا واحدًا على الأقل.'); return; }
    log('▶ قراءة: ' + chosenLabels.join('، ') + ' (' + chosenItems.length + ' جملة)');
    speak(paragraphForItems(chosenItems));
  });
  document.getElementById('readAllBtn').addEventListener('click', function () {
    var chosenItems = [];
    CONTENT_KEYS.forEach(function (key) { categories[key].items.forEach(function (item) { chosenItems.push({ jp: item[0] }); }); });
    log('▶ قراءة كل الجمل (' + chosenItems.length + ' جملة)...');
    speak(paragraphForItems(chosenItems));
  });

  function renderList() {
    listEl.innerHTML = '';
    var items = getCurrentItems();
    if (items.length === 0) {
      var empty = document.createElement('div'); empty.className = 'emptyMsg'; empty.textContent = 'لا توجد جمل هنا بعد.'; listEl.appendChild(empty); return;
    }
    items.forEach(function (s, i) {
      var row = document.createElement('div'); row.className = 'sentenceItem';
      var checkbox = document.createElement('input'); checkbox.type = 'checkbox'; checkbox.id = 'chk-' + i; checkbox.checked = true;
      var txt = document.createElement('div'); txt.className = 'txt';
      txt.innerHTML = '<div class="jp"><span class="num">' + (i + 1) + '.</span> ' + s.jp + '</div><div class="hira">' + s.hira + '</div><div class="ar">' + s.ar + '</div>';
      var starBtn = document.createElement('button'); starBtn.className = 'starBtn' + (isFav(s.id) ? ' faved' : ''); starBtn.textContent = isFav(s.id) ? '★' : '☆';
      starBtn.addEventListener('click', function () {
        toggleFav(s.id); renderList();
        order = getCurrentItems().map(function (_, i2) { return i2; });
        if (cardIndex >= order.length) cardIndex = 0;
        renderCard();
      });
      row.appendChild(checkbox); row.appendChild(txt); row.appendChild(starBtn); listEl.appendChild(row);
    });
  }

  function getSelectedSentences() {
    var items = getCurrentItems(), selected = [];
    items.forEach(function (s, i) { var chk = document.getElementById('chk-' + i); if (chk && chk.checked) selected.push(s.jp); });
    return selected;
  }
  function buildParagraph(selected) { var parts = []; selected.forEach(function (s) { parts.push(s); parts.push(s); }); return parts.join(' '); }

  document.getElementById('selectAllBtn').addEventListener('click', function () { getCurrentItems().forEach(function (s, i) { var c = document.getElementById('chk-' + i); if (c) c.checked = true; }); });
  document.getElementById('clearAllBtn').addEventListener('click', function () { getCurrentItems().forEach(function (s, i) { var c = document.getElementById('chk-' + i); if (c) c.checked = false; }); });
  document.getElementById('startBtn').addEventListener('click', function () {
    var selected = getSelectedSentences();
    if (selected.length === 0) { log('⚠️ محتاج تختار جملة واحدة على الأقل.'); return; }
    log('▶ بعتنا فقرة فيها ' + selected.length + ' جملة...'); speak(buildParagraph(selected));
  });
  document.getElementById('stopBtn').addEventListener('click', stopSpeak);

  /* ---- flashcard ---- */
  var flashcardEl = document.getElementById('flashcard');
  var flashJpEl = document.getElementById('flashJp');
  var flashHiraEl = document.getElementById('flashHira');
  var flashArEl = document.getElementById('flashAr');
  var progressFillEl = document.getElementById('progressFill');
  var progressCountEl = document.getElementById('progressCount');
  var cardFavBtn = document.getElementById('cardFavBtn');
  var cardSpeakBtn = document.getElementById('cardSpeakBtn');

  function renderCard() {
    var items = getCurrentItems();
    if (items.length === 0 || order.length === 0) {
      flashJpEl.textContent = 'لا توجد جمل'; flashHiraEl.textContent = ''; flashArEl.textContent = '';
      progressFillEl.style.width = '0%'; progressCountEl.textContent = '0 / 0';
      return;
    }
    var it = items[order[cardIndex]];
    flashJpEl.textContent = it.jp;
    flashHiraEl.textContent = it.hira;
    flashArEl.textContent = it.ar;
    flashcardEl.classList.remove('revealed');
    var pct = ((cardIndex + 1) / order.length) * 100;
    progressFillEl.style.width = pct + '%';
    progressCountEl.textContent = order.length + ' / ' + (cardIndex + 1);
    cardFavBtn.textContent = isFav(it.id) ? '★' : '☆';
    cardFavBtn.className = 'iconBtn favBtn' + (isFav(it.id) ? ' faved' : '');
  }

  flashcardEl.addEventListener('click', function (e) {
    if (e.target === cardFavBtn || e.target === cardSpeakBtn) return;
    flashcardEl.classList.toggle('revealed');
  });
  document.getElementById('flipBtn').addEventListener('click', function () { flashcardEl.classList.toggle('revealed'); });

  cardFavBtn.addEventListener('click', function () {
    var items = getCurrentItems(); var it = items[order[cardIndex]];
    toggleFav(it.id);
    if (currentCat === 'favorites') {
      order = getCurrentItems().map(function (_, i) { return i; });
      if (order.length === 0) cardIndex = 0; else if (cardIndex >= order.length) cardIndex = order.length - 1;
    }
    renderCard();
  });
  cardSpeakBtn.addEventListener('click', function () {
    var items = getCurrentItems(); if (order.length === 0) return;
    var it = items[order[cardIndex]]; speak(it.jp + ' ' + it.jp);
  });

  document.getElementById('nextBtn').addEventListener('click', function () { if (order.length === 0) return; cardIndex = (cardIndex + 1) % order.length; renderCard(); });
  document.getElementById('prevBtn').addEventListener('click', function () { if (order.length === 0) return; cardIndex = (cardIndex - 1 + order.length) % order.length; renderCard(); });

  var autoPlayBtn = document.getElementById('autoPlayBtn');
  function playStep() {
    if (!isAutoPlaying) return;
    var items = getCurrentItems();
    if (order.length === 0) { stopAutoPlay(); return; }
    var it = items[order[cardIndex]];
    renderCard();
    speak(it.jp + ' ' + it.jp);
    autoPlayTimer = setTimeout(function () {
      if (!isAutoPlaying) return;
      if (cardIndex >= order.length - 1) { stopAutoPlay(); return; }
      cardIndex++; playStep();
    }, 3600);
  }
  function stopAutoPlay() {
    isAutoPlaying = false; clearTimeout(autoPlayTimer);
    autoPlayBtn.textContent = '▶ تشغيل تلقائي مع النطق'; autoPlayBtn.classList.remove('playing');
  }
  autoPlayBtn.addEventListener('click', function () {
    if (isAutoPlaying) { stopAutoPlay(); }
    else { isAutoPlaying = true; autoPlayBtn.textContent = '⏹ إيقاف التشغيل'; autoPlayBtn.classList.add('playing'); playStep(); }
  });

  /* ---- mode toggle ---- */
  var modeToggle = document.getElementById('modeToggle');
  var cardSection = document.getElementById('cardSection');
  var listSection = document.getElementById('listSection');
  var inListMode = false;
  modeToggle.addEventListener('click', function () {
    stopAutoPlay();
    inListMode = !inListMode;
    cardSection.style.display = inListMode ? 'none' : '';
    listSection.style.display = inListMode ? '' : 'none';
    modeToggle.textContent = inListMode ? '🗂 عرض البطاقات' : '📋 عرض القائمة';
    if (inListMode) renderList();
  });

  /* ---- cloud lessons merge ---- */
  function mergeCloudLessons(list) {
    if (!list || list.length === 0) return;
    list.forEach(function (lesson) {
      var mapped = lesson.items.map(function (it) { return [it.jp || '', it.hira || '', it.ar || '']; });
      if (categories[lesson.id] && CONTENT_KEYS.indexOf(lesson.id) !== -1) {
        categories[lesson.id].items = categories[lesson.id].items.concat(mapped);
      } else if (lesson.id !== 'all' && lesson.id !== 'favorites') {
        categories[lesson.id] = { label: lesson.label, items: mapped };
        CONTENT_KEYS.push(lesson.id);
      }
    });
    rebuildIndex();
    buildTabs(); buildBulkPanel();
    order = getCurrentItems().map(function (_, i) { return i; });
    renderCard(); renderList();
    log('☁️ تم تحميل ' + list.length + ' درس إضافي من Firebase.');
  }

  /* ---- init ---- */
  buildTabs(); buildBulkPanel();
  order = getCurrentItems().map(function (_, i) { return i; });
  renderCard(); renderList();
  statusEl.textContent = 'فحص البيئة:';
  log('window.Capacitor موجود؟ ' + (typeof window.Capacitor !== 'undefined'));
  if (window.Capacitor) { log('TtsPlugin موجود؟ ' + ttsAvailable()); } else { log('⚠️ الصفحة مش شغالة جوه تطبيق Capacitor أصلاً.'); }

  window.addEventListener('load', function () {
    var tries = 0;
    var waitForFirebase = setInterval(function () {
      tries++;
      if (window.__fetchCloudLessons) { clearInterval(waitForFirebase); window.__fetchCloudLessons().then(mergeCloudLessons); }
      else if (tries > 40) { clearInterval(waitForFirebase); log('⚠️ تعذر تحميل Firebase (تحقق من الاتصال بالإنترنت).'); }
    }, 150);
  });
</script>
</body>
</html>
