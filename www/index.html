<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تعلم اليابانية - جمل صوتية</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Tahoma, sans-serif;
    background: #f4f4f8;
    margin: 0;
    padding: 16px;
    color: #1f2937;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    padding: 20px;
    max-width: 560px;
    width: 100%;
    margin: 0 auto;
  }
  h2 {
    margin-top: 0;
    text-align: center;
  }
  .controls {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .controls button {
    flex: 1;
    min-width: 120px;
    padding: 10px;
    font-size: 14px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    background: #e5e7eb;
    color: #333;
  }
  .controls button.active {
    background: #2563eb;
    color: #fff;
  }
  .translation-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #f9fafb;
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 14px;
    font-size: 14px;
  }
  .switch {
    position: relative;
    width: 46px;
    height: 26px;
    flex-shrink: 0;
  }
  .switch input { display: none; }
  .slider {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background: #d1d5db;
    border-radius: 999px;
    transition: 0.2s;
  }
  .slider::before {
    content: "";
    position: absolute;
    height: 20px;
    width: 20px;
    right: 3px;
    top: 3px;
    background: #fff;
    border-radius: 50%;
    transition: 0.2s;
  }
  input:checked + .slider {
    background: #2563eb;
  }
  input:checked + .slider::before {
    transform: translateX(-20px);
  }
  #sentenceList {
    max-height: 46vh;
    overflow-y: auto;
    border: 1px solid #eee;
    border-radius: 10px;
    padding: 6px;
    margin-bottom: 14px;
  }
  .sentence-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 8px;
    border-bottom: 1px solid #f1f1f1;
  }
  .sentence-item:last-child { border-bottom: none; }
  .sentence-item input[type="checkbox"] {
    margin-top: 6px;
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }
  .sentence-text {
    flex: 1;
  }
  .hiragana {
    font-size: 18px;
    font-weight: bold;
    color: #111827;
  }
  .meaning {
    font-size: 13px;
    color: #6b7280;
    margin-top: 2px;
  }
  .sentence-item.playing {
    background: #eff6ff;
    border-radius: 8px;
  }
  .play-single {
    background: none;
    border: none;
    font-size: 18px;
    cursor: pointer;
    color: #2563eb;
    flex-shrink: 0;
  }
  button#startBtn {
    width: 100%;
    padding: 16px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    background: #2563eb;
    color: #fff;
    margin-bottom: 8px;
  }
  button#stopBtn {
    width: 100%;
    padding: 12px;
    font-size: 15px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    background: #e5e7eb;
    color: #333;
  }
  #status {
    margin-top: 14px;
    font-size: 13px;
    color: #333;
    background: #f9fafb;
    border-radius: 8px;
    padding: 10px;
    white-space: pre-wrap;
    line-height: 1.6;
    max-height: 100px;
    overflow-y: auto;
  }
  .counter {
    font-size: 13px;
    color: #6b7280;
    text-align: center;
    margin-bottom: 10px;
  }
</style>
</head>
<body>
  <div class="card">
    <h2>🇯🇵 تعلم اليابانية</h2>
    <p class="counter">اختر الجمل التي تريد الاستماع إليها (50 جملة)</p>

    <div class="controls">
      <button id="selectAllBtn">✅ اختيار الكل</button>
      <button id="clearAllBtn">❌ إلغاء الكل</button>
    </div>

    <div class="translation-toggle">
      <span>عرض المعنى بالعربي</span>
      <label class="switch">
        <input type="checkbox" id="showMeaning" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div id="sentenceList"></div>

    <button id="startBtn">▶ اقرأ الجمل المختارة</button>
    <button id="stopBtn">⏹ إيقاف</button>
    <div id="status">جاري فحص البيئة...</div>
  </div>

<script>
  var sentences = [
    { h: "こんにちは", m: "مرحباً" },
    { h: "おはようございます", m: "صباح الخير" },
    { h: "こんばんは", m: "مساء الخير" },
    { h: "さようなら", m: "إلى اللقاء" },
    { h: "ありがとうございます", m: "شكراً جزيلاً" },
    { h: "すみません", m: "آسف / عفواً" },
    { h: "はい、そうです", m: "نعم، هذا صحيح" },
    { h: "いいえ、ちがいます", m: "لا، هذا خطأ" },
    { h: "わたしのなまえはたなかです", m: "اسمي تاناكا" },
    { h: "おげんきですか", m: "كيف حالك؟" },
    { h: "げんきです、ありがとう", m: "أنا بخير، شكراً" },
    { h: "これはなんですか", m: "ما هذا؟" },
    { h: "それはほんです", m: "هذا كتاب" },
    { h: "あれはねこです", m: "ذلك قط" },
    { h: "わたしはがくせいです", m: "أنا طالب" },
    { h: "かれはせんせいです", m: "هو معلم" },
    { h: "きょうはあついです", m: "اليوم حار" },
    { h: "きのうはさむかったです", m: "أمس كان بارداً" },
    { h: "あしたはあめがふります", m: "غداً ستمطر" },
    { h: "いまなんじですか", m: "كم الساعة الآن؟" },
    { h: "じゅうじです", m: "الساعة العاشرة" },
    { h: "どこにいきますか", m: "إلى أين تذهب؟" },
    { h: "がっこうにいきます", m: "أذهب إلى المدرسة" },
    { h: "わたしはにほんごをべんきょうします", m: "أنا أدرس اللغة اليابانية" },
    { h: "これはとてもおもしろいです", m: "هذا ممتع جداً" },
    { h: "あのひとはだれですか", m: "من ذلك الشخص؟" },
    { h: "わたしのかぞくはよにんです", m: "عائلتي أربعة أشخاص" },
    { h: "まいにちうんどうします", m: "أتمرن كل يوم" },
    { h: "ごはんをたべましょう", m: "لنأكل الطعام" },
    { h: "おなかがすきました", m: "أنا جائع" },
    { h: "のどがかわきました", m: "أنا عطشان" },
    { h: "みずをください", m: "أعطني ماء من فضلك" },
    { h: "トイレはどこですか", m: "أين الحمام؟" },
    { h: "たすけてください", m: "ساعدني من فضلك" },
    { h: "わかりません", m: "لا أفهم" },
    { h: "もういちどいってください", m: "قل ذلك مرة أخرى من فضلك" },
    { h: "ゆっくりはなしてください", m: "تحدث ببطء من فضلك" },
    { h: "にほんはうつくしいくにです", m: "اليابان بلد جميل" },
    { h: "さくらのはながすきです", m: "أحب زهور الكرز" },
    { h: "まいあさコーヒーをのみます", m: "أشرب القهوة كل صباح" },
    { h: "しごとがおわりました", m: "انتهى العمل" },
    { h: "いえにかえります", m: "أعود إلى المنزل" },
    { h: "おやすみなさい", m: "تصبح على خير" },
    { h: "たんじょうびおめでとう", m: "عيد ميلاد سعيد" },
    { h: "しあわせなひとです", m: "إنه شخص سعيد" },
    { h: "いっしょにいきませんか", m: "هل تريد الذهاب معي؟" },
    { h: "わたしはにほんがすきです", m: "أحب اليابان" },
    { h: "これをかってもいいですか", m: "هل يمكنني شراء هذا؟" },
    { h: "いくらですか", m: "كم السعر؟" },
    { h: "またあいましょう", m: "لنلتقِ مرة أخرى" }
  ];

  var statusEl = document.getElementById('status');
  var listEl = document.getElementById('sentenceList');
  var showMeaningEl = document.getElementById('showMeaning');
  var isSpeaking = false;
  var stopRequested = false;

  function log(msg) {
    statusEl.textContent += '\n' + msg;
    statusEl.scrollTop = statusEl.scrollHeight;
    console.log(msg);
  }

  function renderList() {
    listEl.innerHTML = '';
    sentences.forEach(function (s, i) {
      var item = document.createElement('div');
      item.className = 'sentence-item';
      item.id = 'item-' + i;

      var checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = true;
      checkbox.id = 'chk-' + i;

      var textWrap = document.createElement('div');
      textWrap.className = 'sentence-text';

      var hira = document.createElement('div');
      hira.className = 'hiragana';
      hira.textContent = s.h;

      var meaning = document.createElement('div');
      meaning.className = 'meaning';
      meaning.textContent = s.m;
      meaning.style.display = showMeaningEl.checked ? 'block' : 'none';

      textWrap.appendChild(hira);
      textWrap.appendChild(meaning);

      var playBtn = document.createElement('button');
      playBtn.className = 'play-single';
      playBtn.textContent = '🔊';
      playBtn.addEventListener('click', function () {
        speakList([s], i);
      });

      item.appendChild(checkbox);
      item.appendChild(textWrap);
      item.appendChild(playBtn);
      listEl.appendChild(item);
    });
  }

  showMeaningEl.addEventListener('change', function () {
    document.querySelectorAll('.meaning').forEach(function (el) {
      el.style.display = showMeaningEl.checked ? 'block' : 'none';
    });
  });

  document.getElementById('selectAllBtn').addEventListener('click', function () {
    sentences.forEach(function (_, i) {
      document.getElementById('chk-' + i).checked = true;
    });
  });

  document.getElementById('clearAllBtn').addEventListener('click', function () {
    sentences.forEach(function (_, i) {
      document.getElementById('chk-' + i).checked = false;
    });
  });

  function getSelected() {
    var selected = [];
    sentences.forEach(function (s, i) {
      if (document.getElementById('chk-' + i).checked) {
        selected.push({ s: s, index: i });
      }
    });
    return selected;
  }

  function highlight(index) {
    document.querySelectorAll('.sentence-item').forEach(function (el) {
      el.classList.remove('playing');
    });
    if (index !== null && index !== undefined) {
      var el = document.getElementById('item-' + index);
      if (el) {
        el.classList.add('playing');
        el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
    }
  }

  function hasNativeTts() {
    return !!(window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.TtsPlugin);
  }

  function speakOneNative(text) {
    return window.Capacitor.Plugins.TtsPlugin.speak({ text: text, lang: 'ja-JP' });
  }

  function speakOneWeb(text) {
    return new Promise(function (resolve, reject) {
      if (!window.speechSynthesis) {
        reject(new Error('speechSynthesis غير متاح في هذا المتصفح'));
        return;
      }
      var utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'ja-JP';
      utter.onend = resolve;
      utter.onerror = function (e) { reject(e.error || e); };
      window.speechSynthesis.speak(utter);
    });
  }

  async function speakList(items, singleIndex) {
    if (isSpeaking) {
      log('⏳ في انتظار انتهاء التشغيل الحالي...');
      return;
    }
    isSpeaking = true;
    stopRequested = false;
    var useNative = hasNativeTts();
    log(useNative ? '▶ بدء القراءة (Plugin الأصلي)...' : '▶ بدء القراءة (متصفح - معاينة)...');

    for (var k = 0; k < items.length; k++) {
      if (stopRequested) { log('⏹ تم إيقاف القراءة.'); break; }
      var entry = items[k];
      var text = entry.s ? entry.s.h : entry.h;
      var idx = entry.index !== undefined ? entry.index : singleIndex;
      highlight(idx);
      try {
        if (useNative) {
          await speakOneNative(text);
        } else {
          await speakOneWeb(text);
        }
      } catch (err) {
        log('❌ خطأ أثناء نطق: ' + text + ' - ' + (err && err.message ? err.message : JSON.stringify(err)));
      }
    }
    highlight(null);
    isSpeaking = false;
    if (!stopRequested) log('✅ انتهت القراءة.');
  }

  window.addEventListener('load', function () {
    renderList();
    statusEl.textContent = 'فحص البيئة:';
    log('window.Capacitor موجود؟ ' + (typeof window.Capacitor !== 'undefined'));
    if (window.Capacitor) {
      log('isNativePlatform؟ ' + (window.Capacitor.isNativePlatform ? window.Capacitor.isNativePlatform() : 'غير معروف'));
      log('TtsPlugin موجود؟ ' + hasNativeTts());
    } else {
      log('⚠️ الصفحة مش شغالة جوه تطبيق Capacitor - هيتم استخدام صوت المتصفح للمعاينة فقط.');
    }
  });

  document.getElementById('startBtn').addEventListener('click', function () {
    var selected = getSelected();
    if (selected.length === 0) {
      log('⚠️ من فضلك اختر جملة واحدة على الأقل.');
      return;
    }
    speakList(selected);
  });

  document.getElementById('stopBtn').addEventListener('click', function () {
    stopRequested = true;
    highlight(null);
    if (hasNativeTts()) {
      window.Capacitor.Plugins.TtsPlugin.stop()
        .then(function () { log('⏹ تم الإيقاف.'); })
        .catch(function (err) { log('❌ خطأ إيقاف: ' + (err && err.message ? err.message : err)); });
    } else if (window.speechSynthesis) {
      window.speechSynthesis.cancel();
      log('⏹ تم الإيقاف.');
    }
    isSpeaking = false;
  });
</script>
</body>
</html>
