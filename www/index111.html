<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار القراءة الصوتية</title>
<style>
  body {
    font-family: -apple-system, "Segoe UI", Tahoma, sans-serif;
    background: #f4f4f8;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    padding: 24px;
    max-width: 480px;
    width: 100%;
  }
  button {
    width: 100%;
    padding: 16px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    background: #2563eb;
    color: #fff;
    margin-top: 12px;
  }
  #stopBtn { background: #e5e7eb; color: #333; }
  #status {
    margin-top: 14px;
    font-size: 14px;
    color: #333;
    background: #f9fafb;
    border-radius: 8px;
    padding: 10px;
    white-space: pre-wrap;
    line-height: 1.8;
  }
</style>
</head>
<body>
  <div class="card">
    <h2>اختبار القراءة الصوتية</h2>
    <p>النص الثابت اللي هيتقرأ:</p>
    <p id="fixedText" style="background:#f0f4ff;padding:10px;border-radius:8px;">
      مرحباً، أنا صوت تجريبي أتحدث الآن للتأكد من أن القراءة الصوتية تعمل بشكل صحيح داخل التطبيق.
    </p>
    <button id="startBtn">▶ اقرأ النص الثابت</button>
    <button id="stopBtn">⏹ إيقاف</button>
    <div id="status">جاري فحص البيئة...</div>
  </div>

<script>
  var statusEl = document.getElementById('status');
  var fixedText = document.getElementById('fixedText').textContent.trim();

  function log(msg) {
    statusEl.textContent += '\n' + msg;
    console.log(msg);
  }

  // فحص البيئة أول ما الصفحة تفتح
  window.addEventListener('load', function () {
    statusEl.textContent = 'فحص البيئة:';
    log('window.Capacitor موجود؟ ' + (typeof window.Capacitor !== 'undefined'));
    if (window.Capacitor) {
      log('isNativePlatform؟ ' + (window.Capacitor.isNativePlatform ? window.Capacitor.isNativePlatform() : 'غير معروف'));
      log('Plugins موجودة؟ ' + (typeof window.Capacitor.Plugins !== 'undefined'));
      if (window.Capacitor.Plugins) {
        log('TtsPlugin موجود؟ ' + (typeof window.Capacitor.Plugins.TtsPlugin !== 'undefined'));
      }
    } else {
      log('⚠️ الصفحة مش شغالة جوه تطبيق Capacitor أصلاً.');
    }
  });

  document.getElementById('startBtn').addEventListener('click', function () {
    if (!window.Capacitor || !window.Capacitor.Plugins || !window.Capacitor.Plugins.TtsPlugin) {
      log('❌ TtsPlugin مش متاح. تأكد إن الـ APK اتبنى بآخر نسخة من الـ workflow وإن الملف ده جوه المشروع مش بيتفتح كملف منفصل.');
      return;
    }
    log('▶ بعتنا النص للـ Plugin...');
    window.Capacitor.Plugins.TtsPlugin.speak({ text: fixedText })
      .then(function () { log('✅ الأمر اتبعت بنجاح للسيرفس.'); })
      .catch(function (err) { log('❌ خطأ: ' + (err && err.message ? err.message : JSON.stringify(err))); });
  });

  document.getElementById('stopBtn').addEventListener('click', function () {
    if (!window.Capacitor || !window.Capacitor.Plugins || !window.Capacitor.Plugins.TtsPlugin) return;
    window.Capacitor.Plugins.TtsPlugin.stop()
      .then(function () { log('⏹ تم الإيقاف.'); })
      .catch(function (err) { log('❌ خطأ إيقاف: ' + err.message); });
  });
</script>
</body>
</html>
