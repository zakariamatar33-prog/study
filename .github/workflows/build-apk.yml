name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Add Android platform
        run: npx cap add android

      - name: Generate icons & splash screen
        run: npx capacitor-assets generate --android

      - name: Sync web assets
        run: npx cap sync android

      - name: Patch manifest & gradle (background audio + Google sign-in)
        run: node scripts/patch-android.js

      - name: Add all permissions needed for uninterrupted background TTS
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml

          # 1) صلاحيات الـ manifest اللازمة للقراءة المستمرة في الخلفية
          grep -q 'android.permission.WAKE_LOCK' "$MANIFEST" || \
            sed -i 's#<application#<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n\n    <application#' "$MANIFEST"

          # 2) لو فيه <service> بيمثل خدمة القراءة، لازم يتحدد نوعه mediaPlayback (إلزامي من Android 14)
          if grep -q '<service' "$MANIFEST" && ! grep -q 'foregroundServiceType' "$MANIFEST"; then
            sed -i 's#<service #<service android:foregroundServiceType="mediaPlayback" #' "$MANIFEST"
          fi

          cat "$MANIFEST"

      - name: Exclude app from battery optimization on first run (MainActivity)
        run: |
          ACTIVITY=$(find android/app/src/main -name "MainActivity.*" | head -n 1)
          if [ -n "$ACTIVITY" ] && ! grep -q 'ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS' "$ACTIVITY"; then
            echo "⚠️  ملاحظة: لضمان عدم إيقاف القراءة بسبب توفير البطارية، لازم كود MainActivity يطلب من المستخدم استثناء التطبيق من Battery Optimization (Intent.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS). هذا الجزء كود Kotlin/Java داخل المشروع، لا يمكن حقنه تلقائيًا عبر sed بأمان — راجع الملف: $ACTIVITY"
          fi

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > android/app/google-services.json

      - name: Use fixed debug keystore (stable SHA-1 across builds)
        run: |
          mkdir -p "$HOME/.android"
          cp debug.keystore "$HOME/.android/debug.keystore"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
