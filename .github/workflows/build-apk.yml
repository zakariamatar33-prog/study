name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Add Android platform
        run: npx cap add android

      - name: Generate icons & splash screen
        run: npx capacitor-assets generate --android

      - name: Sync web assets
        run: npx cap sync android

      - name: Patch manifest & gradle (background audio + Google sign-in)
        run: node scripts/patch-android.js

      - name: Add all permissions needed for uninterrupted background TTS
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml

          # 1) صلاحيات الـ manifest اللازمة للقراءة المستمرة في الخلفية
          grep -q 'android.permission.WAKE_LOCK' "$MANIFEST" || \
            sed -i 's#<application#<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n\n    <application#' "$MANIFEST"

          # 2) لو فيه <service> بيمثل خدمة القراءة، لازم يتحدد نوعه mediaPlayback (إلزامي من Android 14)
          if grep -q '<service' "$MANIFEST" && ! grep -q 'foregroundServiceType' "$MANIFEST"; then
            sed -i 's#<service #<service android:foregroundServiceType="mediaPlayback" #' "$MANIFEST"
          fi

          cat "$MANIFEST"

      - name: Exclude app from battery optimization on first run (MainActivity)
        run: |
          ACTIVITY=$(find android/app/src/main -name "MainActivity.*" | head -n 1)
          if [ -n "$ACTIVITY" ] && ! grep -q 'ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS' "$ACTIVITY"; then
            echo "⚠️  ملاحظة: لضمان عدم إيقاف القراءة بسبب توفير البطارية، لازم كود MainActivity يطلب من المستخدم استثناء التطبيق من Battery Optimization (Intent.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS). هذا الجزء كود Kotlin/Java داخل المشروع، لا يمكن حقنه تلقائيًا عبر sed بأمان — راجع الملف: $ACTIVITY"
          fi

      - name: Generate native TTS foreground-service (radio-style)
        run: |
          set -e
          APP_ID=$(grep -oP 'applicationId\s+"\K[^"]+' android/app/build.gradle)
          PKG_PATH=$(echo "$APP_ID" | tr '.' '/')
          JAVA_DIR="android/app/src/main/java/$PKG_PATH"
          mkdir -p "$JAVA_DIR"

          cat > "$JAVA_DIR/TtsForegroundService.java" << 'EOF'
          package PACKAGE_NAME;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.media.AudioAttributes;
          import android.media.AudioFocusRequest;
          import android.media.AudioManager;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;
          import android.speech.tts.TextToSpeech;
          import android.speech.tts.UtteranceProgressListener;
          import android.support.v4.media.session.MediaSessionCompat;
          import android.support.v4.media.session.PlaybackStateCompat;
          import androidx.core.app.NotificationCompat;
          import androidx.media.app.NotificationCompat.MediaStyle;
          import java.util.Locale;

          public class TtsForegroundService extends Service {
            public static final String ACTION_SPEAK = "PACKAGE_NAME.ACTION_SPEAK";
            public static final String ACTION_STOP = "PACKAGE_NAME.ACTION_STOP";
            public static final String EXTRA_TEXT = "text";
            private static final String CHANNEL_ID = "tts_playback_channel";
            private static final int NOTIFICATION_ID = 4821;

            private TextToSpeech tts;
            private PowerManager.WakeLock wakeLock;
            private MediaSessionCompat mediaSession;
            private AudioManager audioManager;
            private AudioFocusRequest focusRequest;
            private boolean ttsReady = false;
            private String pendingText = null;

            @Override
            public void onCreate() {
              super.onCreate();
              createChannel();
              audioManager = (AudioManager) getSystemService(Context.AUDIO_SERVICE);

              mediaSession = new MediaSessionCompat(this, "TtsForegroundService");
              mediaSession.setCallback(new MediaSessionCompat.Callback() {
                @Override public void onPause() { stopSpeaking(); }
                @Override public void onStop() { stopSpeaking(); }
              });
              mediaSession.setActive(true);

              tts = new TextToSpeech(this, status -> {
                if (status == TextToSpeech.SUCCESS && tts != null) {
                  int langResult = tts.setLanguage(new Locale("ar"));
                  if (langResult == TextToSpeech.LANG_MISSING_DATA || langResult == TextToSpeech.LANG_NOT_SUPPORTED) {
                    tts.setLanguage(Locale.getDefault());
                  }
                  ttsReady = true;
                  if (pendingText != null) {
                    String t = pendingText;
                    pendingText = null;
                    speakNow(t);
                  }
                }
              });

              tts.setOnUtteranceProgressListener(new UtteranceProgressListener() {
                @Override public void onStart(String utteranceId) {
                  setPlaybackState(PlaybackStateCompat.STATE_PLAYING);
                }
                @Override public void onDone(String utteranceId) {
                  setPlaybackState(PlaybackStateCompat.STATE_STOPPED);
                  releaseWakeLock();
                  stopForeground(true);
                  stopSelf();
                }
                @Override public void onError(String utteranceId) {
                  setPlaybackState(PlaybackStateCompat.STATE_ERROR);
                  releaseWakeLock();
                  stopForeground(true);
                  stopSelf();
                }
              });
            }

            @Override
            public int onStartCommand(Intent intent, int flags, int startId) {
              if (intent == null) return START_STICKY;
              String action = intent.getAction();
              if (ACTION_STOP.equals(action)) {
                stopSpeaking();
                return START_NOT_STICKY;
              }
              String text = intent.getStringExtra(EXTRA_TEXT);
              if (text == null) text = "";

              startForeground(NOTIFICATION_ID, buildNotification());
              requestAudioFocus();
              acquireWakeLock();

              if (ttsReady) {
                speakNow(text);
              } else {
                pendingText = text;
              }
              return START_STICKY;
            }

            private void speakNow(String text) {
              String utteranceId = "utt_" + System.currentTimeMillis();
              tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, utteranceId);
            }

            private void stopSpeaking() {
              if (tts != null) tts.stop();
              pendingText = null;
              abandonAudioFocus();
              releaseWakeLock();
              setPlaybackState(PlaybackStateCompat.STATE_STOPPED);
              stopForeground(true);
              stopSelf();
            }

            private void requestAudioFocus() {
              if (audioManager == null) return;
              AudioAttributes attrs = new AudioAttributes.Builder()
                  .setUsage(AudioAttributes.USAGE_MEDIA)
                  .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                  .build();
              focusRequest = new AudioFocusRequest.Builder(AudioManager.AUDIOFOCUS_GAIN)
                  .setAudioAttributes(attrs)
                  .setOnAudioFocusChangeListener(focusChange -> {
                    if (focusChange == AudioManager.AUDIOFOCUS_LOSS ||
                        focusChange == AudioManager.AUDIOFOCUS_LOSS_TRANSIENT) {
                      stopSpeaking();
                    }
                  })
                  .build();
              audioManager.requestAudioFocus(focusRequest);
            }

            private void abandonAudioFocus() {
              if (audioManager != null && focusRequest != null) {
                audioManager.abandonAudioFocusRequest(focusRequest);
              }
            }

            private void acquireWakeLock() {
              if (wakeLock == null) {
                PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "PACKAGE_NAME:TtsWakeLock");
              }
              if (!wakeLock.isHeld()) {
                wakeLock.acquire(30 * 60 * 1000L);
              }
            }

            private void releaseWakeLock() {
              if (wakeLock != null && wakeLock.isHeld()) {
                wakeLock.release();
              }
            }

            private void setPlaybackState(int state) {
              PlaybackStateCompat playbackState = new PlaybackStateCompat.Builder()
                  .setActions(PlaybackStateCompat.ACTION_PLAY_PAUSE | PlaybackStateCompat.ACTION_STOP)
                  .setState(state, 0, 1f)
                  .build();
              mediaSession.setPlaybackState(playbackState);
            }

            private void createChannel() {
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                NotificationChannel channel = new NotificationChannel(
                    CHANNEL_ID, "قراءة النصوص", NotificationManager.IMPORTANCE_LOW);
                channel.setDescription("إشعار تشغيل القراءة الصوتية");
                NotificationManager nm = getSystemService(NotificationManager.class);
                nm.createNotificationChannel(channel);
              }
            }

            private Notification buildNotification() {
              Intent stopIntent = new Intent(this, TtsForegroundService.class);
              stopIntent.setAction(ACTION_STOP);
              PendingIntent stopPendingIntent = PendingIntent.getService(
                  this, 0, stopIntent,
                  Build.VERSION.SDK_INT >= Build.VERSION_CODES.S ? PendingIntent.FLAG_IMMUTABLE : 0);

              return new NotificationCompat.Builder(this, CHANNEL_ID)
                  .setSmallIcon(android.R.drawable.ic_lock_silent_mode_off)
                  .setContentTitle("جاري القراءة")
                  .setContentText("القراءة الصوتية شغالة الآن")
                  .addAction(android.R.drawable.ic_media_pause, "إيقاف", stopPendingIntent)
                  .setStyle(new MediaStyle().setMediaSession(mediaSession.getSessionToken()).setShowActionsInCompactView(0))
                  .setOngoing(true)
                  .setPriority(NotificationCompat.PRIORITY_LOW)
                  .build();
            }

            @Override
            public void onDestroy() {
              if (tts != null) { tts.stop(); tts.shutdown(); }
              releaseWakeLock();
              if (mediaSession != null) mediaSession.release();
              super.onDestroy();
            }

            @Override
            public IBinder onBind(Intent intent) { return null; }
          }
          EOF

          cat > "$JAVA_DIR/TtsPlugin.java" << 'EOF'
          package PACKAGE_NAME;

          import android.content.Intent;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "TtsPlugin")
          public class TtsPlugin extends Plugin {
            @PluginMethod
            public void speak(PluginCall call) {
              String text = call.getString("text", "");
              Intent intent = new Intent(getContext(), TtsForegroundService.class);
              intent.setAction(TtsForegroundService.ACTION_SPEAK);
              intent.putExtra(TtsForegroundService.EXTRA_TEXT, text);
              ContextCompat.startForegroundService(getContext(), intent);
              call.resolve();
            }

            @PluginMethod
            public void stop(PluginCall call) {
              Intent intent = new Intent(getContext(), TtsForegroundService.class);
              intent.setAction(TtsForegroundService.ACTION_STOP);
              getContext().startService(intent);
              call.resolve();
            }
          }
          EOF

          sed -i "s/PACKAGE_NAME/$APP_ID/g" "$JAVA_DIR/TtsForegroundService.java" "$JAVA_DIR/TtsPlugin.java"

          MAIN_ACTIVITY=$(find "$JAVA_DIR" -maxdepth 1 -name "MainActivity.*")
          if [ -n "$MAIN_ACTIVITY" ] && ! grep -q "TtsPlugin" "$MAIN_ACTIVITY"; then
            python3 - "$MAIN_ACTIVITY" << 'PYEOF'
          import sys
          path = sys.argv[1]
          with open(path) as f:
              content = f.read()
          if "onCreate" not in content:
              content = content.replace(
                  "extends BridgeActivity {",
                  "extends BridgeActivity {\n  @Override\n  public void onCreate(android.os.Bundle savedInstanceState) {\n    registerPlugin(TtsPlugin.class);\n    super.onCreate(savedInstanceState);\n  }"
              )
              with open(path, "w") as f:
                  f.write(content)
          PYEOF
          fi

          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "TtsForegroundService" "$MANIFEST"; then
            sed -i "s#</application>#    <service android:name=\".TtsForegroundService\" android:foregroundServiceType=\"mediaPlayback\" android:exported=\"false\" android:stopWithTask=\"false\" />\n</application>#" "$MANIFEST"
          fi

          GRADLE=android/app/build.gradle
          if ! grep -q "androidx.media:media" "$GRADLE"; then
            sed -i "/dependencies {/a\\    implementation \"androidx.media:media:1.6.0\"" "$GRADLE"
          fi

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > android/app/google-services.json

      - name: Use fixed debug keystore (stable SHA-1 across builds)
        run: |
          mkdir -p "$HOME/.android"
          cp debug.keystore "$HOME/.android/debug.keystore"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
